[alembic]
script_location = %(here)s/../../database/migrations
prepend_sys_path = .
sqlalchemy.url = postgresql+asyncpg://jarvis:jarvis@localhost:5433/jarvis

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
