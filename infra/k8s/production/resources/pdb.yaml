apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  namespace: jarvis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: api}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web
  namespace: jarvis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: web}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: worker
  namespace: jarvis
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: worker}