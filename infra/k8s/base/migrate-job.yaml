apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: jarvis
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command:
            - sh
            - -c
            - until pg_isready -h postgres -U jarvis -d jarvis; do sleep 2; done
      containers:
        - name: migrate
          image: jarvis-api:local
          envFrom:
            - secretRef: {name: jarvis-migrate-secret}
          command: ["python", "-m", "alembic", "-c", "alembic.ini", "upgrade", "head"]
