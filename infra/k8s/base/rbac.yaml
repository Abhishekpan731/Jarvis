apiVersion: v1
kind: ServiceAccount
metadata:
  name: jarvis-job-reader
  namespace: jarvis
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jarvis-job-reader
  namespace: jarvis
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jarvis-job-reader
  namespace: jarvis
subjects:
  - kind: ServiceAccount
    name: jarvis-job-reader
    namespace: jarvis
roleRef:
  kind: Role
  name: jarvis-job-reader
  apiGroup: rbac.authorization.k8s.io
