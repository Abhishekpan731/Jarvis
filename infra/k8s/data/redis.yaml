apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-redis-pvc
  namespace: jarvis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec: {command: ["redis-cli", "ping"]}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests: {cpu: "50m", memory: "64Mi"}
            limits: {cpu: "250m", memory: "128Mi"}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: jarvis-redis-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: jarvis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
      targetPort: 6379
