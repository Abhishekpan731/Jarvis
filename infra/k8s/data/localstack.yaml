apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jarvis-localstack-pvc
  namespace: jarvis
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 512Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: jarvis
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: localstack}
  template:
    metadata:
      labels: {app: localstack}
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3
          envFrom:
            - secretRef: {name: jarvis-localstack-secret}
          ports:
            - containerPort: 4566
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
          readinessProbe:
            httpGet: {path: /_localstack/health, port: 4566}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet: {path: /_localstack/health, port: 4566}
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: jarvis-localstack-pvc}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: jarvis
spec:
  selector: {app: localstack}
  ports:
    - port: 4566
      targetPort: 4566
