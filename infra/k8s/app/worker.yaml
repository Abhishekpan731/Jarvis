apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: jarvis
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      serviceAccountName: jarvis-job-reader
      initContainers:
        - name: wait-for-migrate
          image: registry.k8s.io/kubectl:v1.31.0
          command:
            - kubectl
            - -n
            - jarvis
            - wait
            - --for=condition=complete
            - job/migrate
            - --timeout=180s
      containers:
        - name: worker
          image: jarvis-worker:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: jarvis-worker-secret}
          env:
            - name: WORKER_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: jarvis-worker-secret
                  key: WORKER_DATABASE_URL
          startupProbe:
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/live' % os.environ.get('WORKER_HEALTH_PORT','8091'), timeout=2)"
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 30
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/live' % os.environ.get('WORKER_HEALTH_PORT','8091'), timeout=2)"
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:%s/ready' % os.environ.get('WORKER_HEALTH_PORT','8091'), timeout=3)"
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
      restartPolicy: Always
