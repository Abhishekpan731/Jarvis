apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: jarvis
spec:
  replicas: 1
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      serviceAccountName: jarvis-job-reader
      initContainers:
        - name: wait-for-migrate
          image: registry.k8s.io/kubectl:v1.31.0
          command:
            - kubectl
            - -n
            - jarvis
            - wait
            - --for=condition=complete
            - job/migrate
            - --timeout=180s
      containers:
        - name: api
          image: jarvis-api:local
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef: {name: jarvis-api-secret}
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            httpGet: {path: /api/v1/health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          resources:
            requests: {cpu: "100m", memory: "256Mi"}
            limits: {cpu: "500m", memory: "512Mi"}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: jarvis
spec:
  type: NodePort
  selector: {app: api}
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
