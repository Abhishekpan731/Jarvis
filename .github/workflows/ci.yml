name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pip-audit
          python -m pip install -e . --group dev
          python -m pip_audit
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scan web dependencies
        working-directory: apps/web
        run: npm audit --audit-level=high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: jarvis
          POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          POSTGRES_DB: jarvis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jarvis -d jarvis_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      POSTGRES_PASSWORD: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e . --group dev
      - name: Lint Python
        run: ruff check .
      - name: Configure ephemeral database credentials
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          from secrets import token_urlsafe
          from urllib.parse import quote

          database_name = "jarvis_test"
          owner_password = os.environ["POSTGRES_PASSWORD"]
          app_password = token_urlsafe(32)
          worker_password = token_urlsafe(32)
          while worker_password == app_password:
              worker_password = token_urlsafe(32)

          def database_url(username, password, driver):
              encoded_password = quote(password, safe="")
              return (
                  f"postgresql+{driver}://{username}:{encoded_password}"
                  f"@localhost:5432/{database_name}"
              )

          api_url = database_url("jarvis_app", app_password, "asyncpg")
          worker_url = database_url("jarvis_worker", worker_password, "asyncpg")
          values = {
              "DATABASE_URL_SYNC": database_url("jarvis", owner_password, "psycopg"),
              "DATABASE_URL": api_url,
              "WORKER_DATABASE_URL": worker_url,
              "JARVIS_APP_DB_PASSWORD": app_password,
              "JARVIS_WORKER_DB_PASSWORD": worker_password,
              "JARVIS_RLS_TEST_DATABASE_URL": api_url,
              "JARVIS_RLS_TEST_WORKER_DATABASE_URL": worker_url,
          }
          with Path(os.environ["GITHUB_ENV"]).open("a") as github_env:
              github_env.writelines(f"{name}={value}\n" for name, value in values.items())
          for value in [owner_password, *values.values()]:
              print(f"::add-mask::{value}")
          PY
      - name: Migrate and test
        run: |
          alembic -c apps/api/alembic.ini upgrade head
          python -m pytest --cov=apps/api/app --cov=packages/shared/jarvis_shared --cov-report=term-missing
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Lint, typecheck, and production build web
        working-directory: apps/web
        run: |
          npm ci
          npm test
          npm run lint
          npm run typecheck
          npx next build
